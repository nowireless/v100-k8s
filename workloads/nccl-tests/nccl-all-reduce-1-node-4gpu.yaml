# Based on https://raw.githubusercontent.com/coreweave/nccl-tests/refs/heads/master/mpi-operator/nccl-test-distributed-a100-64-mpijob.yaml
apiVersion: kubeflow.org/v2beta1
kind: MPIJob
metadata:
  name: nccl-all-reduce-1-node-4gpu
spec:
  # I have 4 V100s per node
  slotsPerWorker: 4
  runPolicy:
    cleanPodPolicy: Running
  mpiReplicaSpecs:
    Launcher:
      replicas: 1
      template:
        spec:
          containers:
            - image: registry5000.local/scratch/nccl-tests:v2.18.3-hn01
              imagePullPolicy: Always
              name: nccl
              env:
                - name: OMPI_ALLOW_RUN_AS_ROOT
                  value: "1"
                - name: OMPI_ALLOW_RUN_AS_ROOT_CONFIRM
                  value: "1"
                - name: NVIDIA_GDRCOPY
                  value: "enabled"
              # Uncomment to be able to exec in to launcher pod for interactive testing
              # command: ['sleep', '86400']
              command: ["/bin/bash", "-c"]
              args:
              - |
                  # -x NCCL_DEBUG=INFO \
                  # -x NCCL_NET_GDR_LEVEL=0 \

                  # -x UCX_NET_DEVICES=mlx5_2:1,mlx5_3:1 \
                  # -x UCX_TLS=rc,cuda_copy,cuda_ipc,gdr_copy \

                  echo "-- Waiting for worker pods... --"
                  counter=0
                  until timeout 5 mpirun --map-by ppr:1:node hostname &> /dev/null
                  do
                      echo "Attempt ${counter} ..." 
                      counter=$((counter+1))
                      sleep 1
                  done

                  set -ex;
                  echo "-- Topology --"
                  mpirun \
                    --map-by ppr:1:node \
                    nvidia-smi topo -m

                  echo "-- All 4 GPUs --"
                  mpirun \
                    --map-by ppr:4:node \
                    --bind-to none \
                    -x LD_LIBRARY_PATH \
                    -x NCCL_DEBUG=INFO \
                    -x NCCL_DEBUG_SUBSYS=INIT,NET \
                    -x NCCL_SOCKET_IFNAME=eth0 \
                    -x NCCL_IB_DISABLE=1 \
                    -x NCCL_NET_PLUGIN=none \
                    -x NCCL_NET_GDR_LEVEL=PIX \
                    -x NCCL_DMABUF_ENABLE=0 \
                    /usr/local/bin/all_reduce_perf_mpi -b 8M -e 1G -f 2 -g 1


                  echo "-- GPU 0 & 1 --"
                  mpirun \
                    --map-by ppr:2:node \
                    --bind-to none \
                    -x LD_LIBRARY_PATH \
                    -x NCCL_DEBUG=INFO \
                    -x NCCL_DEBUG_SUBSYS=INIT,NET \
                    -x NCCL_SOCKET_IFNAME=eth0 \
                    -x NCCL_IB_DISABLE=1 \
                    -x NCCL_NET_PLUGIN=none \
                    -x NCCL_NET_GDR_LEVEL=PIX \
                    -x NCCL_DMABUF_ENABLE=0 \
                    -x CUDA_VISIBLE_DEVICES=0,1 \
                    /usr/local/bin/all_reduce_perf_mpi -b 8M -e 1G -f 2 -g 1

                  echo "-- GPU 2 & 3 --"
                  mpirun \
                    --map-by ppr:2:node \
                    --bind-to none \
                    -x LD_LIBRARY_PATH \
                    -x NCCL_DEBUG=INFO \
                    -x NCCL_DEBUG_SUBSYS=INIT,NET \
                    -x NCCL_SOCKET_IFNAME=eth0 \
                    -x NCCL_IB_DISABLE=1 \
                    -x NCCL_NET_PLUGIN=none \
                    -x NCCL_NET_GDR_LEVEL=PIX \
                    -x NCCL_DMABUF_ENABLE=0 \
                    -x CUDA_VISIBLE_DEVICES=2,3 \
                    /usr/local/bin/all_reduce_perf_mpi -b 8M -e 1G -f 2 -g 1

                  echo "-- GPU 0 & 2 --"
                  mpirun \
                    --map-by ppr:2:node \
                    --bind-to none \
                    -x LD_LIBRARY_PATH \
                    -x NCCL_DEBUG=INFO \
                    -x NCCL_DEBUG_SUBSYS=INIT,NET \
                    -x NCCL_SOCKET_IFNAME=eth0 \
                    -x NCCL_IB_DISABLE=1 \
                    -x NCCL_NET_PLUGIN=none \
                    -x NCCL_NET_GDR_LEVEL=PIX \
                    -x NCCL_DMABUF_ENABLE=0 \
                    -x CUDA_VISIBLE_DEVICES=0,2 \
                    /usr/local/bin/all_reduce_perf_mpi -b 8M -e 1G -f 2 -g 1

                  echo "-- GPU 1 & 3 --"
                  mpirun \
                    --map-by ppr:2:node \
                    --bind-to none \
                    -x LD_LIBRARY_PATH \
                    -x NCCL_DEBUG=INFO \
                    -x NCCL_DEBUG_SUBSYS=INIT,NET \
                    -x NCCL_SOCKET_IFNAME=eth0 \
                    -x NCCL_IB_DISABLE=1 \
                    -x NCCL_NET_PLUGIN=none \
                    -x NCCL_NET_GDR_LEVEL=PIX \
                    -x NCCL_DMABUF_ENABLE=0 \
                    -x CUDA_VISIBLE_DEVICES=1,3 \
                    /usr/local/bin/all_reduce_perf_mpi -b 8M -e 1G -f 2 -g 1
               
              resources:
                requests:
                  cpu: 2
                  memory: 128Mi
    Worker:
      replicas: 1
      template:
        metadata:
          labels:
            # metadata.coreweave.cloud/job: nccl-test
        spec:
          containers:
            - image: registry5000.local/scratch/nccl-tests:v2.18.3-hn01
              imagePullPolicy: Always
              name: nccl
              env:
              - name: NVIDIA_GDRCOPY
                value: "enabled"
              resources:
                requests:
                  cpu: 4
                  memory: 60Gi
                  nvidia.com/gpu: 4
                  # rdma/rdma_shared_device_a: 1
                  # rdma/rdma_shared_device_b: 1
                limits:
                  cpu: 8
                  memory: 60Gi
                  nvidia.com/gpu: 4
                  # rdma/rdma_shared_device_a: 1
                  # rdma/rdma_shared_device_b: 1
              securityContext:
                capabilities:
                  add:
                  - IPC_LOCK
              volumeMounts:
                - mountPath: /dev/shm
                  name: dshm
          tolerations:
          - effect: NoSchedule
            key: nvidia.com/gpu
            operator: Exists
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: nvidia.com/gpu.product
                        operator: In
                        values:
                          - Tesla-V100-SXM2-16GB
          volumes:
            - name: dshm
              emptyDir:
                medium: Memory
