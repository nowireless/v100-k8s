# Based on https://raw.githubusercontent.com/coreweave/nccl-tests/refs/heads/master/mpi-operator/nccl-test-distributed-a100-64-mpijob.yaml
apiVersion: kubeflow.org/v2beta1
kind: MPIJob
metadata:
  name: interactive-4-nodes
spec:
  # I have 8 cores per node
  slotsPerWorker: 8
  runPolicy:
    cleanPodPolicy: Running
  mpiReplicaSpecs:
    Launcher:
      replicas: 1
      template:
        spec:
          containers:
            - image: registry5000.local/scratch/supermagic:hn01
              imagePullPolicy: Always
              name: nccl
              env:
                - name: OMPI_ALLOW_RUN_AS_ROOT
                  value: "1"
                - name: OMPI_ALLOW_RUN_AS_ROOT_CONFIRM
                  value: "1"
                - name: NVIDIA_GDRCOPY
                  value: "enabled"
              # Uncomment to be able to exec in to launcher pod for interactive testing
              command: ['sleep', '86400']
              # command: ["/bin/bash", "-c"]
              # args:
              # - | 
              #     mpirun \
              #       --map-by ppr:8:node \
              #       --bind-to none \
              #       -x LD_LIBRARY_PATH \
              #       /usr/local/bin/supermagic -V
              
              resources:
                requests:
                  cpu: 2
                  memory: 128Mi
    Worker:
      replicas: 4
      template:
        metadata:
          labels:
            # metadata.coreweave.cloud/job: nccl-test
        spec:
          containers:
            - image: registry5000.local/scratch/supermagic:hn01
              imagePullPolicy: Always
              name: nccl
              env:
              - name: NVIDIA_GDRCOPY
                value: "enabled"
              resources:
                requests:
                  cpu: 2
                  memory: 60Gi
                  nvidia.com/gpu: 2
                  rdma/rdma_shared_device_a: 1
                  rdma/rdma_shared_device_b: 1
                limits:
                  cpu: 8
                  memory: 60Gi
                  nvidia.com/gpu: 2
                  rdma/rdma_shared_device_a: 1
                  rdma/rdma_shared_device_b: 1
              securityContext:
                capabilities:
                  add:
                  - IPC_LOCK
              volumeMounts:
                - mountPath: /dev/shm
                  name: dshm
          tolerations:
          - effect: NoSchedule
            key: nvidia.com/gpu
            operator: Exists
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: nvidia.com/gpu.product
                        operator: In
                        values:
                          - Tesla-V100-SXM2-16GB
          volumes:
            - name: dshm
              emptyDir:
                medium: Memory
