apiVersion: v1
kind: Pod
metadata:
  name: vllm-test
spec:
  tolerations:
  - effect: NoSchedule
    key: nvidia.com/gpu
    operator: Exists
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                  - Tesla-V100-SXM2-16GB
  containers:
  - name: cuda-test
    # image: nvcr.io/nvidia/nvhpc:26.3-devel-cuda_multi-ubuntu24.04
    image: registry.local/nvcr.io/nvidia/cuda:12.9.1-devel-ubuntu24.04
    command:
      - "sleep"
      - "inf"
    resources:
      requests:
        nvidia.com/gpu: 4
      limits:
        nvidia.com/gpu: 4
    securityContext:
      capabilities:
        add:
        - IPC_LOCK
    volumeMounts:
      - mountPath: /dev/shm
        name: dshm
      - mountPath: /data/comfy
        name: comfy
  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
    - name: comfy
      hostPath:
        path: /data/comfy # directory location on host
        type: Directory # this field is optional