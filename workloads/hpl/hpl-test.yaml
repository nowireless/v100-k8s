apiVersion: v1
kind: Pod
metadata:
  name: hpl-test
spec:
  tolerations:
  - effect: NoSchedule
    key: nvidia.com/gpu
    operator: Exists
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                  - Tesla-V100-SXM2-16GB
  containers:
  - name: cuda-test
    # image: nvcr.io/nvidia/nvhpc:26.3-devel-cuda_multi-ubuntu24.04
    image: registry.local/nvcr.io/nvidia/hpc-benchmarks:21.4-hpl
    command:
      - "sleep"
      - "604800"
    resources:
      requests:
        nvidia.com/gpu: 2

        # Not sure if this is needed or not for single node
        # rdma/rdma_shared_device_a: 1
        # rdma/rdma_shared_device_b: 1
      limits:
        nvidia.com/gpu: 2
        # Not sure if this is needed or not for single node
        # rdma/rdma_shared_device_a: 1
        # rdma/rdma_shared_device_b: 1
    securityContext:
      capabilities:
        add:
        - IPC_LOCK
    volumeMounts:
      - mountPath: /dev/shm
        name: dshm
  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
