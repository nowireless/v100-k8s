apiVersion: v1
kind: Pod
metadata:
  name: training-test
spec:
  tolerations:
  - effect: NoSchedule
    key: nvidia.com/gpu
    operator: Exists
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                  - Tesla-V100-SXM2-16GB
  containers:
  - name: cuda-test
    # image: nvcr.io/nvidia/nvhpc:26.3-devel-cuda_multi-ubuntu24.04
    image: registry.local/scratch/nvidia/nvhpc:26.3-runtime-cuda12.9-ubuntu24.04-mpi
    command:
      - "sleep"
      - "inf"
    resources:
      requests:
        nvidia.com/gpu: 4
      limits:
        nvidia.com/gpu: 4
    securityContext:
      capabilities:
        add:
        - IPC_LOCK
    volumeMounts:
      - mountPath: /dev/shm
        name: dshm
      - mountPath: /data
        name: data
  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
    - name: data
      persistentVolumeClaim:
        claimName: training-test-pvc
