apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: topolvm
  namespace: kube-system
spec:
  repo: https://topolvm.github.io/topolvm
  chart: topolvm
  version: v16.1.0
  targetNamespace: topolvm-system
  createNamespace: false
  valuesContent: |-
    lvmd:
      deviceClasses:
        - name: ssd
          volume-group: topolvm-ssd
          default: true
          spare-gb: 10
      tolerations:
      - effect: NoSchedule
        key: nvidia.com/gpu
        operator: Exists

    node:
      tolerations:
      - effect: NoSchedule
        key: nvidia.com/gpu
        operator: Exists

    storageClasses:
      - name: node-local  # Defines name of storage class.
        storageClass:
          # Supported filesystems are: ext4, xfs, and btrfs.
          fsType: xfs
          # reclaimPolicy
          reclaimPolicy:  # Delete
          # Additional annotations
          annotations: {}
          # Default storage class for dynamic volume provisioning
          # ref: https://kubernetes.io/docs/concepts/storage/dynamic-provisioning
          isDefaultClass: false
          # volumeBindingMode can be either WaitForFirstConsumer or Immediate. WaitForFirstConsumer is recommended because TopoLVM cannot schedule pods wisely if volumeBindingMode is Immediate.
          volumeBindingMode: WaitForFirstConsumer
          # enables CSI drivers to expand volumes. This feature is available for Kubernetes 1.16 and later releases.
          allowVolumeExpansion: true
          additionalParameters:
            "topolvm.io/device-class": "ssd"
          # mount options
          mountOptions: []