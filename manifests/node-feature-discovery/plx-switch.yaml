apiVersion: nfd.k8s-sigs.io/v1alpha1
kind: NodeFeatureRule
metadata:
  name: plx-pex8749
spec:
  rules:
    - name: plx.pex8749
      labels:
        plx.feature.node.kubernetes.io/pex8749: "true"
      matchFeatures:
        - feature: pci.device
          matchExpressions:
            vendor:
              op: In
              value: ["10b5"]
            device:
              op: In
              value: ["8749"]